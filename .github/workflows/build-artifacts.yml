name: Build Artifacts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    name: Docker Image Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bonded-server" >> "$GITHUB_OUTPUT"

      - name: Build bonded-server image tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: bonded-server:${{ github.sha }}
          outputs: type=docker,dest=/tmp/bonded-server-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push bonded-server image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonded-server-image-${{ github.sha }}
          path: /tmp/bonded-server-image.tar
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Android APK Artifact
    runs-on: ubuntu-latest
    env:
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "28.2.13676358"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim disk space
        # Standard runners start with ~14 GB free and this job installs an
        # SDK + NDK + Rust + Flutter and builds three ABIs; without this
        # step the job dies with "No space left on device" mid-build (and
        # the runner then cannot even upload its logs). Drop preinstalled
        # toolchains this job never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby /usr/local/lib/android/sdk/ndk-bundle
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # The JNI libraries are built exactly once, by Gradle's
      # buildRustAndroidNative task invoking scripts/build-android-native.sh
      # (all three ABIs). A standalone cargo-ndk pass here previously built
      # them a second time, doubling the Rust build's time and disk.

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK
        working-directory: android
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonded-android-apk-${{ github.sha }}
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
