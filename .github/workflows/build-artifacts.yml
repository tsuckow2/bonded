name: Build Artifacts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    name: Docker Image Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bonded-server" >> "$GITHUB_OUTPUT"

      - name: Build bonded-server image tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: bonded-server:${{ github.sha }}
          outputs: type=docker,dest=/tmp/bonded-server-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push bonded-server image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonded-server-image-${{ github.sha }}
          path: /tmp/bonded-server-image.tar
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Android APK Artifact
    runs-on: ubuntu-latest
    env:
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "28.2.13676358"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim disk space
        # Standard runners start with ~14 GB free and this job installs an
        # SDK + NDK + Rust + Flutter and builds three ABIs; without this
        # step the job dies with "No space left on device" mid-build (and
        # the runner then cannot even upload its logs). Drop preinstalled
        # toolchains this job never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby /usr/local/lib/android/sdk/ndk-bundle
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # The JNI libraries are built exactly once, by Gradle's
      # buildRustAndroidNative task invoking scripts/build-android-native.sh
      # (all three ABIs). A standalone cargo-ndk pass here previously built
      # them a second time, doubling the Rust build's time and disk.

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK
        working-directory: android
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonded-android-apk-${{ github.sha }}
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-core:
    name: Windows Rust Core Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Npcap SDK
        # pnet_datalink links Packet.lib on Windows, and the test
        # binary is the first thing that actually links (the library
        # build never links, so `cargo build` passes without it).
        # The stock runner has no Packet.lib, so fetch the SDK and
        # point the linker at it. The SDK ships both x86 and x64
        # Packet.lib files; the x64 one (Lib\x64) is required or the
        # link fails with LNK4272 (machine-type conflict) and
        # unresolved Packet* symbols.
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP\npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP\npcap-sdk.zip" -DestinationPath "$env:TEMP\npcap-sdk" -Force
          $packetLib = Get-ChildItem -Path "$env:TEMP\npcap-sdk" -Recurse -Filter "Packet.lib" | Where-Object { $_.DirectoryName -match 'x64$' } | Select-Object -First 1
          if (-not $packetLib) { throw "Packet.lib (x64) not found in Npcap SDK" }
          "RUSTFLAGS=-L native=$($packetLib.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Npcap runtime
        # The SDK only provides Packet.lib (the import library) for
        # linking. At runtime the test binary needs Packet.dll, which
        # comes from the Npcap runtime — without it the test process
        # fails to start with 0xc0000135 STATUS_DLL_NOT_FOUND.
        # The official installer hangs in silent mode on this runner
        # (stuck >10 min at the driver install), so instead of
        # running it, extract Packet.dll/wpcap.dll from it with 7-Zip
        # (preinstalled) and put them on PATH. The DLLs only need to
        # be loadable; the driver itself is not required for the
        # test binary to start.
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.90.exe" -OutFile "$env:TEMP\npcap-1.90.exe"
          & 7z x "$env:TEMP\npcap-1.90.exe" -o"$env:TEMP\npcap-extract" -y | Out-Null
          $dllDir = "$env:TEMP\npcap-dlls"
          New-Item -ItemType Directory -Path $dllDir -Force | Out-Null
          # Pick the x64 DLL by PE machine type (0x8664), not by folder
          # name — the extracted layout has no reliable 'x64' in the
          # path, and the x86 DLL produces 0xc000007b in the x64
          # test binary.
          function Get-DllMachine($path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }
          foreach ($name in @("Packet.dll", "wpcap.dll")) {
            $dll = Get-ChildItem -Path "$env:TEMP\npcap-extract" -Recurse -Filter $name | Where-Object { (Get-DllMachine $_.FullName) -eq 0x8664 } | Select-Object -First 1
            if (-not $dll) { throw "$name (x64) not found in Npcap installer" }
            Copy-Item $dll.FullName $dllDir
          }
          $dllDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # First slice of the Windows desktop work (codingwell/bonded#1):
      # does the Rust core build and do its tests pass on a native
      # Windows runner? The Linux cross-compile attempt
      # (x86_64-pc-windows-gnu) stopped at the C toolchain before any
      # Rust code was type-checked, so the real porting surface is
      # still unmeasured. This job measures it natively.
      #
      # WINDOWS BASELINE (run 44652533178, 2026-11-20): the core
      # builds, and 112/117 tests pass. The 5 failures are
      # environmental, matching the Linux sandbox baseline pattern:
      # 4 are the same network-dependent QUIC/WSS tests that fail in
      # the Linux sandbox (peer_listener reversed_introduction +
      # signed_introduction, client_integration
      # mixed_websocket_quic_failover + multipath_can_mix_websocket
      # _and_naive_tcp — all "closed by peer" / "deadline elapsed"),
      # and 1 is interfaces_can_be_enumerated (pnet_datalink returns
      # no interfaces because the Npcap driver is not installed —
      # only its DLLs are present). The h3 QUIC tests pass on
      # Windows, so QUIC itself works; the 4 failures are a
      # TLS/handshake investigation for the desktop work, not a
      # build problem.
      - name: Build bonded-client
        run: cargo build -p bonded-client

      - name: Test bonded-client
        run: cargo test -p bonded-client

  macos-core:
    name: macOS Rust Core Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add 127.0.0.2/127.0.0.3 loopback aliases
        # Bind-awareness tests dial from 127.0.0.2 and 127.0.0.3 as
        # second/third local addresses (bonded-client's two bind tests
        # use .2; bonded-ffi's two-path session tests use .2 + .3).
        # Linux treats the whole 127/8 range as loopback, so they bind
        # out of the box; macOS only configures 127.0.0.1, and binding
        # the others fails with EADDRNOTAVAIL (os error 49). The aliases
        # are a standard loopback configuration for the job.
        run: sudo ifconfig lo0 alias 127.0.0.2 up && sudo ifconfig lo0 alias 127.0.0.3 up

      # Second slice of the macOS desktop work (plan row 4.96): does
      # the Rust core build and do its tests pass on a native macOS
      # runner? The macOS analog of PR #2 (windows-core). The 2026-11-19
      # macOS cross-compile check stopped at the C toolchain
      # (aws-lc-sys runs host cc with Apple-only flags) before any Rust
      # code was type-checked, so the real porting surface is still
      # unmeasured — this job measures it natively, where the Apple
      # toolchain exists. It also builds + tests bonded-ffi, which
      # carries the new plain C-ABI for desktop shells (4.95): proving
      # the FFI compiles on macOS is the point of this slice. No
      # Npcap-style native dependency is needed on macOS (pnet_datalink
      # links the system libpcap; the tun crate knows utun).
      - name: Build bonded-client
        run: cargo build -p bonded-client

      - name: Test bonded-client
        run: cargo test -p bonded-client

      # The FFI result is measured independently: `if: always()` so
      # these steps run even when the client test step fails (the
      # client suite has known environmental failures; they must not
      # hide the FFI verdict, which is the point of this slice).
      - name: Build bonded-ffi
        if: always()
        run: cargo build -p bonded-ffi

      - name: Test bonded-ffi
        if: always()
        run: cargo test -p bonded-ffi
